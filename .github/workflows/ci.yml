# This is the name shown in github actions
name: CI/CD

# It says run the workflow whenever someone pushes to main or updates a pull request targeting to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
# Jobs are group of steps that run together on one machine 
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ...
      redis:
        image: redis:7-alpine
        ...

# clones your repo's code onto that fresh VM. Without this step, the VM would be empty — no code to test at all
    steps:
      - name: Check out code
        uses: actions/checkout@v4

# install python on new vm machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

# Install all the dependency and requiremnts

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/taskmanager_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-api:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-api:${{ github.sha }}

