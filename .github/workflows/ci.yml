# This name shows up in the GitHub "Actions" tab as the workflow's title.
name: CI/CD

# Defines WHEN this workflow runs.
on:
  push:
    branches: [main]         # runs on every push directly to main
  pull_request:
    branches: [main]         # runs whenever a PR targeting main is opened/updated

# A workflow is made of one or more "jobs".
jobs:

  test:
    runs-on: ubuntu-latest   

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432       
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379        # exposes Redis on localhost:6379 for this job
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # "steps" are the actual sequence of actions/commands this job runs,
    # in order, top to bottom, on the VM described above.
    steps:
      # Clones your repo's code onto this fresh VM.
      # Without this, the VM is empty — there's no code to test.
      - name: Check out code
        uses: actions/checkout@v4

      # Installs Python 3.12 onto the VM.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs everything your app needs — same as running this locally.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Actually runs your Pytest suite.
      # `env:` here sets environment variables just for THIS step — these
      # are what config.py / conftest.py read to find Postgres and Redis.
      # Note: "localhost", not "db"/"redis" like in docker-compose.yml,
      # because GitHub's service containers are exposed on the VM's
      # localhost directly (different networking model than Compose).
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/taskmanager_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
        run: pytest -v

  # ---------------------------------------------------------------------
  # JOB 2: Build and push the Docker image (only if tests passed)
  # ---------------------------------------------------------------------
  build-and-push:
    needs: test               # won't start unless the "test" job succeeds
    runs-on: ubuntu-latest     # again, a completely separate fresh VM
    # Only run this job on an actual push to main — not on pull requests,
    # since PRs (especially from forks) shouldn't be able to push images.
    if: github.event_name == 'push'

    # By default, jobs get minimal permissions. This explicitly grants
    # just what's needed: read the repo, and write to GitHub's package
    # registry (to push the Docker image). Least-privilege in action.
    permissions:
      contents: read
      packages: write

    steps:
      # Same as before — this is a NEW VM, so the code must be checked
      # out again here too. Nothing carries over from the "test" job.
      - name: Check out code
        uses: actions/checkout@v4

      # Logs Docker into GitHub Container Registry (ghcr.io) so it's
      # allowed to push images there.
      # github.actor = whoever triggered this workflow run.
      # secrets.GITHUB_TOKEN = auto-generated by GitHub per run — you
      # never had to create or store this token yourself.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the Docker image using the Dockerfile in the repo root
      # (context: .), then pushes it to ghcr.io.
      # Tagged twice:
      #   - "latest"          -> always points to the newest build
      #   - github.sha        -> the exact commit hash, so every image
      #                          is traceable back to the code that built it
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-api:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-api:${{ github.sha }}
